# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
# 2. Signing
# Generate a signing certificate in the Windows Application
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
#
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: Make
run-name: ${{ github.event.head_commit.message }} by @${{ github.actor }}

on:
  push:
    branches: [ "publish" ]
  pull_request:
    branches: [ "publish" ]

jobs:

  make:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: ubuntu-26.04  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    timeout-minutes: 240

    permissions:
      contents: write   # to push the updated www/book-covers back to the repository

    env:
      Configuration: ${{ matrix.configuration }}
      GitHubAction: true
      BibmarkVersion: 5.0.0

    steps:    
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive

    # Install the .NET Core workload
    - name: Install .NET 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x

    # bibmark is built from the BibleMarkdown submodule (PackAsTool makes it the executable bibmark.dll).
    - name: Build bibmark
      shell: bash
      run: |
        dotnet pack BibleMarkdown/BibleMarkdown/BibleMarkdown.csproj \
          -c ${{ matrix.configuration }} \
          -p:PackAsTool=true \
          -p:Version=$BibmarkVersion \
          -p:FileVersion=$BibmarkVersion.0 \
          -p:AssemblyVersion=$BibmarkVersion
        dotnet tool install -g BibleMarkdown --add-source BibleMarkdown/nupkg

    # TeX Live from the Ubuntu packages, on the runner itself. (xu-cheng/texlive-action does not install anything on the
    # runner: it runs the command of its "run" input inside a docker image, and it has no install-miktex input; that is why
    # xelatex was not found.) Windows is not needed: make.sh, bibmark and pandoc all run on Linux.
    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex texlive-latex-recommended texlive-latex-extra \
          texlive-fonts-recommended texlive-fonts-extra texlive-lang-english texlive-lang-german texlive-lang-spanish \
          texlive-lang-greek texlive-lang-other \
          fontconfig

    # The tex files use the fonts of the Fonts folder (BibleRoman ...), by name, so they have to be installed.
    - name: Install the fonts
      run: |
        mkdir -p ~/.fonts
        find Fonts -type f \( -iname '*.ttf' -o -iname '*.otf' \) -exec cp {} ~/.fonts/ \;
        fc-cache -f
        fc-list | grep -ci "BibleRoman"
        fc-list | grep -ciE "Cardo|Frank Ruehl" || echo "Cardo or Frank Ruehl CLM was not found"

    - name: Setup Pandoc
      uses: r-lib/actions/setup-pandoc@v2
      with:
        pandoc-version: '3.13'

    - name: Verify Installations
      run: |
        dotnet --info
        xelatex --version
        pandoc --version
        bibmark --version

    - name: Run make.sh
      run: |
        chmod +x make.sh
        ./make.sh

    # Zips every Bible folder of Bibles into www/books and writes www/books/index.json, which lists the zips and the
    # info.json of each: the Bibles that the BibleReader offers for download (BibliaLibre in its list of online Bibles).
    # The pdf, md, epub, html, xml and zip files of the out folders go to www/out/<Bible>.
    - name: Publish the Bibles for the BibleReader
      run: bibmark publish Bibles www

    # Commits the changes that the publish made to www/book-covers (the only tracked part of www, see www/.gitignore)
    # and pushes them back to publish. Pushes made with the GITHUB_TOKEN do not start another run of this workflow.
    - name: Commit and push www/book-covers
      if: github.event_name == 'push' && github.ref == 'refs/heads/publish'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add www
        if git diff --cached --quiet; then
          echo "No changes in www/book-covers"
        else
          git commit -m "Updated www/book-covers by publish"
          git push origin HEAD:publish
        fi

    # The www folder becomes the GitHub Pages site of this repository (https://<owner>.github.io/BibliaLibre/, so
    # .../books/index.json is what the BibleReader reads). No token is needed: the deploy job below uses the
    # permissions of the workflow. In the settings of the repository, Pages > Source has to be "GitHub Actions".
    - name: Upload www as the Pages artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/publish'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./www

  # Only push builds of publish deploy, not pull requests.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/publish'
    needs: make
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
